<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lacianda POS - Login</title>
  <meta name="google-site-verification" content="ZAFazDxQy2R6EXQW2xnB_VxxSTk64zmZM2D4cadjcMk" />
  
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Google OAuth Configuration -->
    <div id="g_id_onload"
         data-client_id="344066291812-ek6nmskdibqm7fqa0l1v19mougs2ev6c.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <!-- Google Sign-In Button Container -->
    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>
  </div>

  <!-- Handler script placed at the bottom of <body> -->
  <script>
    /**
     * Decodes the Google JWT credential token and saves user state locally
     */
    function handleCredentialResponse(response) {
      try {
        // Decode JWT payload without external libraries
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );

        const payload = JSON.parse(jsonPayload);

        // Extract profile information
        const userEmail = payload.email;
        const userName = payload.name;

        // Persist session to localStorage
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userEmail', userEmail);
        if (userName) localStorage.setItem('userName', userName);

        // Display app interface
        showPOSMainScreen();

      } catch (error) {
        console.error('Failed to parse Google Credential Token:', error);
      }
    }

    function showPOSMainScreen() {
      console.log('User authenticated. Switching to POS main screen...');
    }
  </script>
</body>
</html>
